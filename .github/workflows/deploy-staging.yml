name: Deploy staging

# Deploys dev to the hosted staging demo after every merge, in order:
# 1. apply new migrations to the staging database (prisma migrate deploy),
# 2. build and deploy the app on Vercel,
# 3. check the public address now runs this commit (/api/version) and shows
#    Elevate's login.
# Each deploy carries a version worked out from git, e.g. v0.1.0-dev.23+abc1234
# (scripts/app-version.mjs, #43), shown in the site's footer and the run summary.
# Migrations run first, so new code never meets an old database.
#
# Needs these in the repository's "staging" environment (Settings,
# Environments, staging); without them this workflow does nothing:
#   secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, STAGING_DIRECT_URL
#   variable (optional): STAGING_URL, e.g. https://elevate-staging.vercel.app
# The Vercel project's own settings hold the app's variables (DATABASE_URL and
# the rest); `npm run staging:setup` sets them. See DEPLOYMENT.md.

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - name: Skip when staging isn't set up yet
        id: ready
        run: |
          missing=""
          for name in DIRECT_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "Staging is not set up (missing:$missing); nothing deployed. See DEPLOYMENT.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$STAGING_URL" ]; then
            echo "::warning::STAGING_URL is empty, so the live check will be skipped. Add it as a variable (not a secret) in Settings, Environments, staging."
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          # Full history and tags: the version counts commits since the last release tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.ready.outputs.ok == 'true'

      - name: Apply pending migrations
        if: steps.ready.outputs.ok == 'true'
        run: npx prisma migrate deploy

      - name: Work out the version
        id: version
        if: steps.ready.outputs.ok == 'true'
        run: node scripts/app-version.mjs --deployed --github-output

      # Vercel's builder has no .git folder, so the version goes in as build variables.
      - name: Deploy to Vercel
        if: steps.ready.outputs.ok == 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ steps.version.outputs.commit }}
          BUILD_TIME: ${{ steps.version.outputs.built_at }}
        run: |
          npx -y vercel@63.1.2 deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_APP_VERSION="$APP_VERSION" \
            --build-env NEXT_PUBLIC_COMMIT_SHA="$COMMIT_SHA" \
            --build-env NEXT_PUBLIC_BUILD_TIME="$BUILD_TIME"
          echo "Deployed **$APP_VERSION** ([commit](https://github.com/$GITHUB_REPOSITORY/commit/$COMMIT_SHA))" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the live site runs this commit and shows Elevate's login
        if: steps.ready.outputs.ok == 'true' && env.STAGING_URL != ''
        env:
          COMMIT_SHA: ${{ steps.version.outputs.commit }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            info=$(curl -fsS "$STAGING_URL/api/version" || true)
            if echo "$info" | grep -q "\"commit\":\"$COMMIT_SHA\""; then
              page=$(curl -fsS "$STAGING_URL/login" || true)
              if echo "$page" | grep -q 'name="password"'; then
                echo "$STAGING_URL runs $COMMIT_SHA and shows Elevate's login: $info"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "$STAGING_URL/api/version answered: ${info:-nothing}"
          echo "Expected commit $COMMIT_SHA and Elevate's login form. If the page is Vercel's own login, set Deployment Protection to Standard; otherwise check the deployment's logs."
          exit 1
