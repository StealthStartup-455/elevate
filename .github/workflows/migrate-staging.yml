name: Migrate staging database

# Applies new migrations to the hosted staging database when they reach dev.
# Shared databases only ever change through `prisma migrate deploy` here,
# never by hand. Needs the STAGING_DIRECT_URL secret (the direct connection,
# port 5432) in the repository's "staging" environment; without it this
# workflow does nothing. See DEPLOYMENT.md.

on:
  push:
    branches: [dev]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
    steps:
      - name: Skip when staging isn't set up yet
        id: ready
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "STAGING_DIRECT_URL is not set; nothing to migrate."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.ready.outputs.ok == 'true'
      - name: Apply pending migrations
        if: steps.ready.outputs.ok == 'true'
        run: npx prisma migrate deploy
