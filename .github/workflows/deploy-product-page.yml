name: Deploy product page

on:
  push:
    branches: [dev]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-product-page.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-product-page
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: product-page
      url: ${{ steps.deployment.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check whether product-page deployment is configured
        id: ready
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "Product-page deployment is not set up (missing:$missing); nothing deployed. See DEPLOYMENT.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Deploy product page to Vercel
        id: deployment
        if: steps.ready.outputs.ok == 'true'
        run: |
          url=$(npx -y vercel@63.1.2 deploy docs --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed product page to $url" >> "$GITHUB_STEP_SUMMARY"
